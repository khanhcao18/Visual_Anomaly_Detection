seed: 42
device: auto
data:
  train_normal_dir: data/raw/train/normal
  test_normal_dir: data/raw/test/normal
  test_abnormal_dir: data/raw/test/abnormal
  image_size: 128
training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  validation_split: 0.2
  patience: 8
  latent_channels: 128
threshold:
  method: percentile
  percentile: 95
outputs:
  checkpoint: models/autoencoder.pt
  threshold: models/autoencoder_threshold.json
  history_csv: reports/autoencoder_history.csv
  results_csv: reports/results.csv
